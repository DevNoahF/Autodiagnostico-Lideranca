name: CI - Netlify Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall -q app.py build_static.py config controller models services

      - name: Validar JSON do instrumento
        run: python -m json.tool config/instrument.json >/dev/null

      - name: Validar importação da aplicação
        run: python -c "from app import app; assert app.title"

      - name: Gerar site estático
        run: python build_static.py
