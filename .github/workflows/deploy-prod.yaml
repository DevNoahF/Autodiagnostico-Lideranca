name: CI/CD - Render

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m compileall -q app.py config controller models services

      - name: Validar JSON do instrumento
        run: python -m json.tool config/instrument.json >/dev/null

      - name: Validar importação da aplicação
        run: python -c "from app import app; assert app.title"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Disparar deploy no Render
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "O segredo RENDER_DEPLOY_HOOK_URL não está configurado."
            exit 1
          fi
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"