<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> Equipe | Liderança e Gestão do Conhecimento</title>
  <link rel="icon" type="image/png" href="/images/logoIcon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/style.css?v=3" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script>
    (function () {
      var savedTheme = localStorage.getItem('theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-row">
      <div>
        <h1>Sobre a equipe</h1>
      </div>
      <div class="topbar-actions">
        <nav class="page-nav">
          <a href="/inicio">Inicio</a>
          <a href="/equipe" aria-current="page">Sobre a equipe</a>
          <a href="/instrumento-de-autodiagnostico">Instrumento de Autodiagnóstico</a>
        </nav>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Alternar tema">🌙 Modo Escuro</button>
      </div>
    </div>
  </header>
  <main class="container content-main team-page">
    <p class="section-lead">Conheça as pessoas que participam da construção deste Projeto:</p>
    <section class="team-carousel" aria-label="Pessoas que participaram do projeto">
      <button class="carousel-control carousel-control-prev" type="button" aria-label="Pessoa anterior">
        <i class="bi bi-arrow-left" aria-hidden="true"></i>
      </button>
      <div class="team-carousel-viewport">
        <div class="team-grid" id="teamGrid">
          <!-- Renderizado dinamicamente via JavaScript -->
        </div>
      </div>
      <button class="carousel-control carousel-control-next" type="button" aria-label="Próxima pessoa">
        <i class="bi bi-arrow-right" aria-hidden="true"></i>
      </button>
    </section>

  </main>
  <script src="/static/js/team.js?v=2"></script>
</body>

</html>
